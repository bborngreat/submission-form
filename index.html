<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Mr. OddJobs · Hand over your boring task</title>
    <!-- Google Fonts: Cormorant Garamond & Parkinsans (same as homepage) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Parkinsans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Scroll Progress Bar (optional, kept for brand consistency) -->
    <div id="scroll-progress"></div>

    <!-- Minimal header (hamburger removed for focused flow; brand mark preserved) -->
    <header class="site-header minimal-header">
        <div class="header-inner">
            <span class="brand-mark">Task Submission Portal</span>
        </div>
    </header>

    <!-- Main container – holds either the form or success/error states -->
    <div class="container" id="app-container">

        <!-- FORM VIEW (initially visible) -->
        <div id="form-view">
            <!-- Progress header -->
            <div class="progress-area">
                <div class="progress-text">
                    <span id="step-counter">01 / 07</span>
                </div>
                <div class="progress-bar-track">
                    <div class="progress-bar-fill" id="progress-fill"></div>
                </div>
            </div>

            <!-- Step container (single question shown at a time) -->
            <div id="step-container" class="glass-box step-box">
                <!-- Steps injected by JavaScript -->
            </div>

            <!-- Navigation buttons -->
            <div class="nav-buttons">
                <button type="button" id="back-btn" class="btn-outline" aria-label="Previous question">Back</button>
                <button type="button" id="next-btn" class="btn-gold" aria-label="Next question">Next</button>
                <button type="button" id="submit-btn" class="btn-gold hidden" aria-label="Submit request">Send my request</button>
            </div>

            <!-- Live region for validation / status messages -->
            <div id="form-message" class="form-message" aria-live="polite"></div>

            <!-- Honeypot field (invisible) -->
            <div class="honeypot-field" aria-hidden="true">
                <label for="website">Website</label>
                <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
            </div>
        </div>

        <!-- SUCCESS VIEW (hidden by default) -->
        <div id="success-view" class="glass-box success-box hidden">
            <h2 class="success-title">Got it.</h2>
            <p class="success-text">Your request has been sent. I'll look it over and get back to you using the contact method you selected.</p>
            <p class="success-signoff">Talk soon.</p>
            <a href="index.html" class="btn-gold" id="back-home-btn">Back to Mr. OddJobs</a>
        </div>

        <!-- ERROR VIEW (hidden by default, shown only on submission failure) -->
        <div id="error-view" class="glass-box error-box hidden">
            <p class="error-text" id="error-message-text">Something went wrong while sending that. Your answers are still here. Check your connection and try again.</p>
            <button type="button" class="btn-gold" id="retry-btn">Try again</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
